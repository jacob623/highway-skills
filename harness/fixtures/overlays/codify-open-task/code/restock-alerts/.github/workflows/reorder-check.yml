name: Reorder check

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check reorder points
        env:
          STOCK_TOKEN: ${{ secrets.STOCK_TOKEN }}
        run: |
          curl -fsS -H "Authorization: Bearer $STOCK_TOKEN" \
            "https://orders.northwind.example/stock?below=reorder" > reorder.json
